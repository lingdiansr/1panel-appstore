services:
  pdf2zh:
    image: byaidu/pdf2zh:1.9.11
    container_name: ${CONTAINER_NAME}
    restart: always
    command:
      - pdf2zh
      - -i
      - --serverport
      - "7860"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ${DATA_PATH}/config:/root/.config/PDFMathTranslate
      - ${DATA_PATH}/files:/app/pdf2zh_files
    ports:
      - ${PANEL_APP_PORT_HTTP}:7860
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
