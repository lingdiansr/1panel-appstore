services:
  pdf2zh:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ZOTERO_PDF2ZH_FROM_IMAGE: awwaawwa/pdfmathtranslate-next:v2.9.0-babeldoc-v0.6.4
        SERVER_URL: https://github.com/guaguastandup/zotero-pdf2zh/releases/download/v4.1.7/server.zip
    container_name: ${CONTAINER_NAME}
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    volumes:
      - ${DATA_PATH}/config:/app/server/config
      - ${DATA_PATH}/files:/app/server/translated
    ports:
      - ${PANEL_APP_PORT_HTTP}:8890
    labels:
      createdBy: "Apps"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true
